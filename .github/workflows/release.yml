name: Build and publish Payload Manager catalog

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates clang-18 lld-18 llvm-18 make python3 curl unzip

      - name: Install pinned PS5 Payload SDK
        run: |
          mkdir -p "$RUNNER_TEMP/ps5-sdk"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.50/ps5-payload-sdk.zip \
            -o "$RUNNER_TEMP/ps5-payload-sdk.zip"
          printf '%s  %s\n' \
            2993a69e52fea04a32bf1753318fc60b3f918ab635bdf946870e7d1849557bb2 \
            "$RUNNER_TEMP/ps5-payload-sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ps5-payload-sdk/bin/prospero-clang"

      - name: Build ELF
        env:
          PS5_PAYLOAD_SDK: ${{ runner.temp }}/ps5-payload-sdk
          LLVM_CONFIG: /usr/bin/llvm-config-18
          PATH: /usr/lib/llvm-18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          make clean
          make RD_VERSION="${RELEASE_TAG#v}"

      - name: Update Payload Manager catalog
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          python3 scripts/render-payload-catalog.py \
            --repository "$REPOSITORY" --version "$VERSION" --artifact rd-downloader.elf
          if [[ -n "$(git status --porcelain -- payloads.json distribution/rd-downloader.elf)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add payloads.json distribution/rd-downloader.elf
            git commit -m "Update Payload Manager catalog for $VERSION"
            git push origin "$DEFAULT_BRANCH"
          fi
